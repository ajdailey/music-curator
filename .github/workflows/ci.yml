name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, knowledge-file validation and the test suite on both supported
  # platforms, at the oldest and newest supported Python. Generation needs the
  # private library export, so it does not run here.
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Runs the Windows setup script's prerequisite check; it changes nothing.
      - name: setup.bat --check
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\setup.bat --check
      - name: Install
        run: python -m pip install -e ".[plex,dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Validate knowledge files
        run: music-playlists validate
      - name: Tests
        run: python -m pytest -q
