  # Studio records whose titles trip version detection. `clear_flags` keeps
  # each one a studio take.
  Hole:
    Live Through This:
      clear_flags:
        - live
      note: Studio album; the title is not a live marker.

  Pat Metheny:
    We Live Here:
      clear_flags:
        - live
      note: Pat Metheny Group studio album (1995).

  Rush:
    Vapor Trails (Remixed):
      clear_flags:
        - remix
      note: The 2013 remix of the studio album, not a dance remix.

  Pink Floyd:
    A Momentary Lapse of Reason (2019 Remix):
      clear_flags:
        - remix
      note: The 2019 remix of the studio album, not a dance remix.
    Delicate Sound of Thunder (2019 Remix):
      clear_flags:
        - remix
      note: The 2019 remix of the live album; it stays live.

  Korn:
    "Korn III_ Remember Who You Are (Special":
      clear_flags: [live]
      note: Studio album; "Are You Ready To Live?" is a song title.

  # Reissues of live albums whose titles read "(Live_Remix)" or "(Live_Remixed
  # '94)": a remix of the multitrack, not a dance remix.
  Buddy Rich:
    Big Swing Face:
      clear_flags: [remix]
      note: Live album remixed for reissue.

  Thad Jones:
    Live At The Village Vanguard:
      clear_flags: [remix]
      note: Live album remixed for its 1994 reissue.

  The Who:
