# Album-level knowledge.
#
# `patterns` match many albums by name at once. `albums` carry curated
# per-album knowledge and win over patterns.
#
# Album `tags` are added to the artist's tags for membership purposes, so an
# album can belong somewhere its artist does not. Album `flags` feed version
# classification, so an album can be marked live without every title saying so.
#
# An explicit entry can also remove what it would otherwise inherit:
#
#   clear_tags:  [heartland-rock]  # dropped from the artist's tags for this album
#   clear_flags: [live]            # never classified live, by flag or by text
#
# `clear_flags` is what keeps an album titled "Live Through This" a studio
# record. `validate` rejects an undeclared tag or an unknown flag in either list.

patterns:
  # Official bootleg and archival concert series name their albums by date and
  # venue: "1975_10_18 West Hollywood, CA". Nothing in the album or track title
  # says "live". Without this rule the concert recordings are classified as
  # studio takes and compete with real studio material in genre playlists.
  - name: dated-concert-recording
    album_matches: '^(19|20)\d{2}[-_./]\d{2}[-_./]\d{2}(\s|$)'
    flags:
      - live
    note: >-
      Matches the Pearl Jam and Bruce Springsteen archival series.

  # "Live at the Fillmore 1971" style names where the year trails the venue,
  # and concert albums whose titles never say "live" ("The Koln Concert").
  # Every `concert` album in the export is a concert recording.
  - name: live-venue-recording
    album_matches: '(?i)\b(?:live\s+(?:at|in|from)|concerts?|unplugged)\b'
    flags:
      - live

albums:
  # Nebraska, The Ghost of Tom Joad and Devils & Dust are solo acoustic
  # records, and the Seeger Sessions are folk standards. Their entries add
  # `folk` and clear the rock tags the rest of the catalog carries, so they
  # reach the folk playlists and leave Heartland Rock and Rock Library.
  # `Nebraska '82_ Expanded Edition` is not covered: it adds the E Street Band
  # "Electric Nebraska" sessions to the acoustic album.
  Bruce Springsteen:
    Nebraska:
      tags: &springsteen-acoustic
        - singer-songwriter
        - folk
      clear_tags: &springsteen-not-rock
        - heartland-rock
        - singer-songwriter-rock
        - rock
      masterpiece: true
      complete_album: true
      year: 1982
      note: Solo acoustic demos issued as the finished album.
    Album Collection Vol. 1 - Nebraska:
      tags: *springsteen-acoustic
      clear_tags: *springsteen-not-rock
      note: Nebraska as issued in the Album Collection box.
    Nebraska Outtakes:
      tags: *springsteen-acoustic
      clear_tags: *springsteen-not-rock
      note: Solo acoustic outtakes from the Nebraska sessions.
    Born in the U.S.A.:
      masterpiece: true
      complete_album: true
      year: 1984
    Born to Run:
      masterpiece: true
      complete_album: true
      year: 1975
    The Ghost of Tom Joad:
      tags: *springsteen-acoustic
      clear_tags: *springsteen-not-rock
      year: 1995
      note: Acoustic companion to Nebraska.
    Album Collection Vol. 2 - The Ghost Of T:
      tags: *springsteen-acoustic
      clear_tags: *springsteen-not-rock
      note: The Ghost of Tom Joad as issued in the Album Collection box.
    Devils & Dust:
      tags: *springsteen-acoustic
      clear_tags: *springsteen-not-rock
      year: 2005
      note: Mostly solo acoustic; the third record of the acoustic trilogy.
    We Shall Overcome_ The Seeger Sessions:
      tags:
        - folk
      clear_tags: *springsteen-not-rock
      year: 2006
      note: Folk standards associated with Pete Seeger.

  Neil Young:
    Harvest:
      tags:
        - folk
        - folk-rock
        - singer-songwriter
      masterpiece: true
      complete_album: true
      year: 1972
    Rust Never Sleeps:
      masterpiece: true
      complete_album: true
      year: 1979
    Acoustic Electric:
      flags:
        - live
      note: Concert recording; three of its titles carry no live marker.

  R.E.M.:
    Murmur:
      masterpiece: true
      complete_album: true
      year: 1983
    Automatic For The People:
      masterpiece: true
      complete_album: true
      year: 1992

  Wilco:
    Yankee Hotel Foxtrot:
      masterpiece: true
      complete_album: true
      year: 2002

  # Miles Davis carries cool-jazz, hard-bop, modal-jazz and jazz-fusion across
  # the catalog. These entries place albums by era: the acoustic records leave
  # Jazz Fusion, and the electric period (In a Silent Way onward, and the
  # 1980s comeback) leaves Cool Jazz, Hard Bop and Modal Jazz. Transitional
  # records (Miles In The Sky, Filles De Kilimanjaro, Water Babies,
  # Directions, Circle In The Round) and multi-era compilations keep the
  # artist tags.
  Miles Davis:
    Kind Of Blue:
      clear_tags: [jazz-fusion, hard-bop]
      masterpiece: true
      complete_album: true
      year: 1959
      note: Modal and cool.
    Birth Of The Cool: &miles-cool
      tags: [cool-jazz]
      clear_tags: [hard-bop, modal-jazz, jazz-fusion]
      note: The 1949-1950 nonet sessions.
    The Complete Birth Of The Cool: *miles-cool
    E.S.P_: &miles-second-quintet
      tags: [post-bop]
      clear_tags: [cool-jazz, jazz-fusion]
      note: Second quintet studio album.
    Miles Smiles: *miles-second-quintet
    Sorcerer: *miles-second-quintet
    Nefertiti: *miles-second-quintet
    "'Round About Midnight": &miles-acoustic
      clear_tags: [jazz-fusion]
      note: Acoustic era, before 1968.
    "1951-1959 The Essential Works": *miles-acoustic
    "1958 Miles": *miles-acoustic
    "At Newport 1958": *miles-acoustic
    "At Plugged Nickel, Chicago (Live)": *miles-acoustic
