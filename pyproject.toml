[project]
name = "music-curator"
version = "0.4.0"
description = "Generate curated Rockbox and Plex playlists from a master M3U library export."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
plex = ["plexapi>=4.17"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
music-playlists = "music_engine.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# The selection below is explicit because ruff's default rule set widens with
# each release: without it, upgrading ruff turns a clean tree into dozens of
# findings that nothing in the project asked for.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W/F are the baseline, I keeps import order deterministic, UP holds the
# tree at the 3.11 floor pyproject declares, and B/C4/PERF catch real defects.
#
# BLE, S and TRY are deliberately absent. The Plex and Last.fm clients catch
# `Exception` at the boundary with a third-party library on purpose - one of
# those catches exists so plexapi's exception text, which can contain the
# token, never propagates. The YAML loaders raise ValueError for a mistyped
# configuration key, which is the accurate exception for a bad config value.
select = ["E", "W", "F", "I", "UP", "B", "C4", "PERF"]
